name: Build resume

on:
  push:
    paths:
      - "resume.typ"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "resume.typ"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.14.2"

      - run: typst compile resume.typ resume.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf
